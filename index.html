<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Jalur Sub-4</title>
</head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: satu kolom ala aplikasi, nomor dada (bib) sebagai kepala, tab bawah. Warna: aspal kebiruan + merah garis finis. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#F4F6F8; --ink:#121E29; --muted:#566574; --line:#D7DEE5;
  --accent:#D63A24; --accent-ink:#FFFFFF; --accent-soft:#FBE4DF;
  --blue:#2459B8; --blue-soft:#E1EAF8;
  --good:#1B8A55; --good-soft:#DDF1E6; --warn:#9A5E08; --bad:#B8322A;
  --band1:#E6EBF0; --band2:#DCE6F5; --band3:#F6E3DE; --band4:#F3DCD5; --band5:#E4F0E9;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141B; --surface:#151F29; --surface2:#1B2733; --ink:#E9EFF4; --muted:#93A2B0; --line:#273543;
    --accent:#FF6A52; --accent-ink:#1A0B07; --accent-soft:#3A1E19;
    --blue:#7FAAF2; --blue-soft:#1B2B47;
    --good:#4FCB8C; --good-soft:#143427; --warn:#E3A650; --bad:#FF7A6D;
    --band1:#1B2631; --band2:#18283F; --band3:#3A2420; --band4:#44261F; --band5:#16322A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#151F29; --surface2:#1B2733; --ink:#E9EFF4; --muted:#93A2B0; --line:#273543;
  --accent:#FF6A52; --accent-ink:#1A0B07; --accent-soft:#3A1E19;
  --blue:#7FAAF2; --blue-soft:#1B2B47;
  --good:#4FCB8C; --good-soft:#143427; --warn:#E3A650; --bad:#FF7A6D;
  --band1:#1B2631; --band2:#18283F; --band3:#3A2420; --band4:#44261F; --band5:#16322A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px 96px;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); background:var(--bg); z-index:10}
.wrap{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
h1,h2,h3{font-family:var(--f-display); font-weight:700; letter-spacing:.01em; margin:0; text-wrap:balance}
h2{font-size:1.5rem; line-height:1.1}
h3{font-size:1.15rem; line-height:1.15}
p{margin:0}
.num{font-family:var(--f-display); font-variant-numeric:tabular-nums; font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.kicker{font-family:var(--f-display); text-transform:uppercase; letter-spacing:.09em; font-size:.85rem; font-weight:600; color:var(--muted)}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px; border-radius:6px}

/* top bar */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:4px}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand img{width:34px; height:34px; border-radius:8px; display:block}
.brand b{font-family:var(--f-display); font-size:1.35rem; letter-spacing:.02em}
.iconbtn{border:1px solid var(--line); background:var(--surface); border-radius:10px; width:40px; height:40px; display:grid; place-items:center}

/* bib hero */
.hero{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:stretch}
.hero-left{display:flex; flex-direction:column; justify-content:center; gap:2px; min-width:0}
.hero-left .big{font-size:4.2rem; line-height:.9}
.hero-left .big small{display:block; font-size:1.15rem; font-weight:600; margin:2px 0 4px; color:var(--muted); letter-spacing:.03em}
.bib{
  position:relative; background:#fff; color:#121E29; border:2px solid #121E29; border-radius:10px; padding:12px 14px 10px; min-width:0; width:138px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  box-shadow:0 2px 0 rgba(0,0,0,.12);
}
.bib i{position:absolute; width:8px; height:8px; border-radius:50%; background:#121E29; opacity:.85}
.bib i:nth-child(1){left:7px; top:7px} .bib i:nth-child(2){right:7px; top:7px}
.bib i:nth-child(3){left:7px; bottom:7px} .bib i:nth-child(4){right:7px; bottom:7px}
.bib .t{font-family:var(--f-display); text-transform:uppercase; letter-spacing:.14em; font-weight:700; font-size:.8rem; color:#D63A24}
.bib .n{font-family:var(--f-display); font-weight:700; font-size:3.1rem; line-height:1; white-space:nowrap}
.bib .p{font-family:var(--f-display); font-weight:600; font-size:.95rem; letter-spacing:.04em}

/* cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 14px 16px; display:flex; flex-direction:column; gap:12px; min-width:0}
.card-h{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.pill{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:3px 10px; font-size:.8rem; font-weight:600; background:var(--surface2); border:1px solid var(--line); white-space:nowrap}
.pill.good{background:var(--good-soft); color:var(--good); border-color:transparent}
.pill.warn{color:var(--warn)}
.pill.bad{color:var(--bad)}
.dot{width:8px; height:8px; border-radius:50%; background:currentColor; display:inline-block}

/* this week */
.week-top{display:flex; gap:14px; align-items:center}
.ring{flex:none; width:96px; height:96px; position:relative}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring .track{stroke:var(--line)} .ring .bar{stroke:var(--accent); transition:stroke-dashoffset .5s}
.ring .c{position:absolute; inset:0; display:grid; place-items:center; text-align:center; line-height:1}
.ring .c b{font-family:var(--f-display); font-size:1.7rem}
.ring .c span{font-size:.7rem; color:var(--muted)}
.days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.day{border:1px solid var(--line); background:var(--surface2); border-radius:10px; padding:6px 2px 7px; text-align:center; display:flex; flex-direction:column; gap:2px; align-items:center; min-width:0}
.day .d{font-family:var(--f-display); font-weight:600; font-size:.85rem; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
.day .k{font-family:var(--f-display); font-weight:700; font-size:1.05rem; line-height:1.1}
.day .s{font-size:.7rem; color:var(--muted); line-height:1.1}
.day.done{background:var(--good-soft); border-color:transparent} .day.done .k{color:var(--good)}
.day.today{border:2px solid var(--accent)}
.day.missed .k{color:var(--muted); text-decoration:line-through}
.day.rest{opacity:.75}

/* tiles */
.tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:2px; min-width:0}
.tile .v{font-family:var(--f-display); font-weight:700; font-size:2rem; line-height:1.05; font-variant-numeric:tabular-nums}
.tile .v small{font-size:.9rem; color:var(--muted); font-weight:600; margin-left:3px}
.tile .l{font-size:.8rem; color:var(--muted)}

/* chart */
.chart{width:100%; height:auto; display:block; touch-action:manipulation}
.chart text{font-family:var(--f-body); font-size:9.5px; fill:var(--muted)}
.chart .grid{stroke:var(--line); stroke-width:1}
.chart .plan{fill:var(--blue); opacity:.28}
.chart .plan.rec{opacity:.16}
.chart .act{fill:var(--accent)}
.chart .race{fill:var(--accent)}
.chart .sel{fill:none; stroke:var(--ink); stroke-width:1.4}
.chart .now{fill:var(--ink)}
.chart .hit{fill:transparent; cursor:pointer}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.8rem; color:var(--muted)}
.legend span::before{content:""; display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px}
.legend .a::before{background:var(--blue); opacity:.4} .legend .b::before{background:var(--accent)}
.legend .f1::before{background:var(--band1); border:1px solid var(--line)} .legend .f2::before{background:var(--band2); border:1px solid var(--line)}
.legend .f3::before{background:var(--band3); border:1px solid var(--line)} .legend .f4::before{background:var(--band4); border:1px solid var(--line)}
.legend .f5::before{background:var(--band5); border:1px solid var(--line)}
h1.t1{font-family:var(--f-display); font-size:1.35rem; letter-spacing:.02em; margin:0}
.selinfo{background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap}

/* buttons */
.btn{border:0; border-radius:10px; padding:10px 16px; font-weight:700; background:var(--accent); color:var(--accent-ink); min-height:44px}
.btn.ghost{background:var(--surface2); color:var(--ink); border:1px solid var(--line)}
.btn.sm{padding:6px 12px; min-height:36px; font-size:.9rem}
.btn[disabled]{opacity:.55; cursor:default}

/* schedule */
.weekgrid{display:grid; grid-template-columns:repeat(13,1fr); gap:4px}
.wk{aspect-ratio:1; border-radius:6px; border:1px solid var(--line); background:var(--surface2); font-family:var(--f-display); font-weight:700; font-size:.8rem; padding:0; color:var(--ink); position:relative}
.wk.p1{background:var(--band1)} .wk.p2{background:var(--band2)} .wk.p3{background:var(--band3)} .wk.p4{background:var(--band4)} .wk.p5{background:var(--band5)}
.wk.cur{outline:2px solid var(--accent); outline-offset:1px}
.wk.sel{border:2px solid var(--ink)}
.wk.dn::after{content:""; position:absolute; right:3px; top:3px; width:6px; height:6px; border-radius:50%; background:var(--good)}
.weeknav{display:flex; align-items:center; justify-content:space-between; gap:8px}
.weeknav .mid{text-align:center; min-width:0}
.weeknav .mid .num{font-size:1.5rem; line-height:1.1}
.sess{display:grid; grid-template-columns:44px 1fr auto auto; gap:8px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--surface2)}
.sess .dn{font-family:var(--f-display); font-weight:700; font-size:1rem; text-transform:uppercase; letter-spacing:.05em; line-height:1.1}
.sess .dn small{display:block; font-family:var(--f-body); font-weight:500; font-size:.7rem; color:var(--muted); letter-spacing:0; text-transform:none}
.sess .tt{font-weight:600; line-height:1.25}
.sess .tt small{display:block; font-weight:400; color:var(--muted); font-size:.82rem}
.sess.done{background:var(--good-soft); border-color:transparent}
.sess.today{border:2px solid var(--accent)}
.sess.rest{background:transparent; border-style:dashed}
.swp{width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; padding:0; font-size:1.1rem; color:var(--muted)}
.swp.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.swp[disabled]{visibility:hidden}
.chk{width:34px; height:34px; border-radius:50%; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; padding:0; color:transparent; font-weight:800}
.chk.on{background:var(--good); border-color:var(--good); color:#fff}
.chk[disabled]{visibility:hidden}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:.92rem}
th,td{text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:top}
th{font-family:var(--f-display); text-transform:uppercase; letter-spacing:.07em; font-size:.8rem; color:var(--muted); font-weight:600; white-space:nowrap}
td.n{font-variant-numeric:tabular-nums; white-space:nowrap}
.fld{display:flex; flex-direction:column; gap:4px}
.fld label{font-size:.85rem; color:var(--muted); font-weight:600}
input[type=text]{font:inherit; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--surface); color:var(--ink); min-height:44px; width:100%; font-variant-numeric:tabular-nums}
.seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.seg button{flex:1; border:0; background:var(--surface); padding:10px 8px; min-height:44px; font-weight:600}
.seg button.on{background:var(--ink); color:var(--bg)}
.result{background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:4px}
.result .num{font-size:2.2rem; line-height:1}
.verdict{border-left:4px solid var(--accent); padding-left:10px}
.verdict.good{border-color:var(--good)} .verdict.mid{border-color:var(--warn)}

/* details */
details{border:1px solid var(--line); border-radius:12px; background:var(--surface)}
details>summary{cursor:pointer; padding:12px 14px; font-weight:700; list-style:none; display:flex; justify-content:space-between; gap:10px; align-items:center; min-height:44px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+"; font-family:var(--f-display); font-size:1.4rem; color:var(--muted)}
details[open]>summary::after{content:"\2212"}
details .dbody{padding:0 14px 14px; display:flex; flex-direction:column; gap:8px}
details ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px}

/* tabs */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
  padding:6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
}
.tabs .in{max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:2px}
.tab{border:0; background:transparent; padding:6px 2px; border-radius:10px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.72rem; font-weight:600; color:var(--muted); min-height:52px; min-width:0}
.tab svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.tab.on{color:var(--accent); background:var(--accent-soft)}
.btnrow{display:flex; gap:8px; flex-wrap:wrap}
a.btn{display:inline-flex; align-items:center; text-decoration:none}
.tg{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); cursor:pointer}
.tg:first-of-type{border-top:0}
.tg span{display:flex; flex-direction:column; min-width:0}
.tg small{color:var(--muted); font-size:.82rem; font-weight:400; line-height:1.3}
.tg input{appearance:none; -webkit-appearance:none; flex:none; width:48px; height:28px; border-radius:999px; background:var(--line); position:relative; margin:0; cursor:pointer; transition:background .2s}
.tg input::after{content:""; position:absolute; left:3px; top:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.3); transition:transform .2s}
.tg input:checked{background:var(--good)}
.tg input:checked::after{transform:translateX(20px)}
input[type=date]{font:inherit; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--surface); color:var(--ink); min-height:44px; width:100%}
ol.steps{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px}
.status{border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--surface2); font-size:.92rem}
@media (prefers-reduced-motion:reduce){ .tg input,.tg input::after{transition:none} }
.pane[hidden]{display:none}
.pane{display:flex; flex-direction:column; gap:14px}
.note{font-size:.85rem; color:var(--muted)}
.empty{border:1px dashed var(--line); border-radius:12px; padding:14px; color:var(--muted); font-size:.92rem}
@media (min-width:560px){ .hero-left .big{font-size:4.2rem} .tiles{grid-template-columns:repeat(4,1fr)} }
@media (prefers-reduced-motion:reduce){ .ring .bar{transition:none} }
</style>

<div class="wrap" id="app">
  <div class="topbar">
    <div class="brand"><img id="logo" alt="" width="34" height="34"><h1 class="t1">Jalur Sub-4</h1></div>
    <button class="iconbtn" id="themeBtn" aria-label="Ganti tema terang atau gelap" title="Ganti tema">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <section class="pane" id="p-dash" aria-label="Dasbor"></section>
  <section class="pane" id="p-plan" aria-label="Jadwal" hidden></section>
  <section class="pane" id="p-pace" aria-label="Pace dan lomba" hidden></section>
  <section class="pane" id="p-guide" aria-label="Panduan" hidden></section>
  <section class="pane" id="p-set" aria-label="Pengaturan" hidden></section>
</div>

<script>

function chartSvg(){
  var W=400,H=212, L=26,R=6,T=22,B=44, iw=W-L-R, ih=H-T-B, ymax=60, slot=iw/N, bw=Math.max(3.5,slot*0.7);

  s+='<text x="'+L+'" y="10">km per minggu</text>';

    s+='<text x="'+x.toFixed(1)+'" y="'+Math.max(y,18).toFixed(1)+'" text-anchor="'+(m[0]===52?'end':'middle')+'" style="fill:var(--ink);font-weight:700">'+m[1]+'</text>';
  });
  if(started){ var cx=L+(cw-1)*slot+slot/2; s+='<path class="now" d="M'+(cx-3.5).toFixed(1)+' '+(T+ih+1)+' L'+(cx+3.5).toFixed(1)+' '+(T+ih+1)+' L'+cx.toFixed(1)+' '+(T+ih-5)+' Z"/>'; }

function zonesCard(){

  function pace(ms){ return fmtPace(1000/ms); }
  var h='<div class="tw"><table><thead><tr><th>Zona</th><th>Detak jantung (bpm)</th><th>Pace (/km)</th></tr></thead><tbody>';
  var n=Math.max(hr.length, rz.length), i;
  for(i=0;i<n;i++){
    var a=hr[i], b=rz[i], hrT = a ? (a.max!==undefined&&a.max!==null ? (a.min+"–"+a.max) : (a.min+"+")) : "—";
    var pT="—"; if(b){ if(!b.min) pT="lebih lambat dari "+pace(b.max); else if(b.max===undefined||b.max===null) pT="lebih cepat dari "+pace(b.min); else pT=pace(b.max)+"–"+pace(b.min); }

  }
  h+='</tbody></table></div><p class="note">Dibaca dari Strava'+(z.run_zone_source?' (sumber zona pace: '+esc(z.run_zone_source)+')':'')+'. Zona pace Strava diperkirakan dari prediksi performa, jadi anggap sebagai acuan kasar.</p>';
  return h;
}

function hmOut(){
  var hm=parseTime(S.hm);
  if(!hm) return '<p class="note">Isi waktu seperti 2:04:37 (jam:menit:detik).</p>';
  var pred=hm*Math.pow(42.195/21.0975,1.06);
  var c = hm<=6900 ? ["good","Jalur sub-4 aman. Pertahankan pace maraton 5:41/km."] : (hm<=7200 ? ["mid","Target realistis 4:00–4:10. Pakai pace maraton sekitar 5:50/km."] : ["","Target realistis 4:10–4:20. Pakai pace maraton sekitar 6:00/km dan fokus finish kuat."]);
  return '<div class="result"><span class="muted small">Perkiraan waktu maraton</span><span class="num">'+fmtTime(pred)+'</span><span class="muted small">Rata-rata '+fmtPace(pred/42.195)+'/km (rumus Riegel, perkiraan kasar)</span></div><div class="verdict '+c[0]+'"><b>'+c[1]+'</b></div>';
}
function tgOut(){
  var tt=parseTime(S.target);
  if(!tt) return '<p class="note">Isi target seperti 3:59:00.</p>';
  var d=S.strat==="neg"?0.01:0, marks=[5,10,15,20,21.0975,25,30,35,40,42.195];
  function cum(km){ if(km<=21.0975) return tt/2*(1+d)*km/21.0975; return tt/2*(1+d)+tt/2*(1-d)*(km-21.0975)/21.0975; }
  var prevK=0, prevT=0;
  return '<div class="result"><span class="muted small">Pace rata-rata</span><span class="num">'+fmtPace(tt/42.195)+' /km</span></div>'+
    '<div class="tw"><table><thead><tr><th>Titik</th><th>Waktu</th><th>Pace segmen</th></tr></thead><tbody>'+marks.map(function(k){
      var t=cum(k), p=(t-prevT)/(k-prevK), lab=k===21.0975?'Half (21,1)':k===42.195?'Finish (42,2)':k+' km'; prevK=k; prevT=t;
      return '<tr><td><b>'+lab+'</b></td><td class="n">'+fmtTime(t)+'</td><td class="n">'+fmtPace(p)+'/km</td></tr>';
    }).join("")+'</tbody></table></div>';
}

  function dt(t,body){ return '<details><summary>'+t+'</summary><div class="dbody">'+body+'</div></details>'; }
  var h='';
  h+=dt('Ada kegiatan mendadak','<p>Urutan yang dipertahankan: long run, lalu sesi kualitas (Kamis), lalu easy run, lalu kekuatan.</p><ul><li>Easy run Selasa yang dikorbankan lebih dulu.</li><li>Satu sesi terlewat tidak perlu diganti. Lanjut ke jadwal berikutnya.</li><li>Jangan menumpuk dua sesi keras di hari yang berdekatan.</li></ul>');
  h+=dt('Asap pekat atau udara buruk','<ul><li>Pindah ke treadmill, atau ganti dengan kekuatan dan sepeda statis.</li><li>Geser long run satu atau dua hari ke hari yang udaranya lebih baik.</li><li>Hentikan lari bila batuk, sesak, atau dada terasa berat.</li><li>Absen lebih dari 10 hari? Mulai lagi dari sekitar 70% volume terakhir, lalu naik sekitar 10% per minggu.</li></ul>');
  h+=dt('Kekuatan 30 menit (Senin dan Rabu)','<ul><li>Split squat atau step-up: 3×8 per kaki</li><li>Glute bridge atau hip thrust: 3×12</li><li>Calf raise: 3×15</li><li>Plank dan side plank: 3×30–45 detik</li></ul><p class="note">Dua minggu terakhir sebelum lomba kurangi jadi 20 menit, tanpa beban baru.</p>');
  h+=dt('Fueling dan minum','<ul><li>Untuk lari 18 km ke atas, mulai 30 g karbohidrat per jam dari menit ke-45, lalu naik pelan-pelan sampai 60 g per jam.</li><li>Minum 150–200 ml tiap 20 menit sesuai rasa haus. Di panas Riau tambah elektrolit.</li><li>Coba semua produk dan jumlahnya saat latihan, jangan ada yang baru di hari lomba. Minggu 48 adalah gladi resik fueling.</li></ul>');
  h+=dt('Sakit atau cedera','<ul><li>Demam atau nyeri tajam: berhenti dulu.</li><li>Nyeri yang menetap lebih dari satu minggu: periksa ke dokter atau fisioterapis.</li><li>Pegal otot biasa boleh lanjut dengan easy run lebih pendek.</li></ul>');
  h+=dt('Taper dan hari lomba','<ul><li>Minggu 50 sampai 52 volume turun ke sekitar 36, 27, lalu lomba. Intensitas tetap ada, jaraknya yang dipotong.</li><li>10 km pertama pada 5:45–5:50/km. Jangan lebih cepat dari rencana.</li><li>Target paruh pertama sekitar 1:59–2:00 untuk finish sub-4.</li><li>Pakai sepatu dan pakaian yang sudah dicoba di long run.</li></ul>');
  h+='<div class="card"><h3>Pasang di layar utama</h3><p class="small">Untuk memasang sebagai aplikasi, simpan berkas HTML-nya ke hosting statis (misalnya GitHub Pages atau Netlify), buka di Chrome atau Safari, lalu pilih Tambahkan ke Layar Utama. Ikon dan manifest sudah ada di dalam satu berkas itu. Sinkron Strava otomatis hanya jalan di dalam aplikasi Claude.</p></div>';
  document.getElementById("p-guide").innerHTML=h;
}

function lastActDate(){ var m=""; S.acts.forEach(function(a){ if(a.date>m) m=a.date; }); if(!m) return ""; var p=m.split("-"); return dmy(utc(+p[0],+p[1]-1,+p[2])); }
function tgl(k,title,desc,extra){
  return '<label class="tg"><span><b>'+title+'</b><small>'+desc+'</small></span><input type="checkbox" role="switch" data-act="set" data-k="'+k+'"'+(S.set[k]?' checked':'')+(extra||'')+'></label>';
}

     (S.testMsg?'<div class="status" role="status">'+esc(S.testMsg)+'</div>':'')+
     '<div class="btnrow"><button class="btn" data-act="sync" '+(st.state==="loading"||!S.set.strava?'disabled':'')+'>Sinkron sekarang</button><button class="btn ghost" data-act="test">Uji koneksi</button><button class="btn ghost" data-act="perms">Kelola izin</button></div>'+

        tgl('trail','Hitung trail run','Trail run ikut dijumlahkan sebagai lari.')+
        tgl('virt','Hitung virtual run (treadmill)','Lari di treadmill ikut dijumlahkan, berguna saat asap pekat.')+
        tgl('wk','Hitung Workout dan Crossfit sebagai kekuatan','Weight Training selalu dihitung sebagai sesi kekuatan.')+'</div>'+
     '<p class="note">Halaman ini hanya membaca data (aktivitas, zona, profil) dan tidak bisa mengubah akun Strava. Memutus sambungan sepenuhnya dilakukan di claude.ai, Pengaturan, Konektor, Strava. Tombol Kelola izin membuka panel izin artifact ini.</p>'+
     '<div class="btnrow"><a class="btn ghost sm" href="https://www.strava.com/settings/apps" target="_blank" rel="noopener noreferrer">Buka pengaturan aplikasi Strava</a></div></div>';

  var fromSnap = S.sync.code==="snap";
  if(!S.hasMcp){
    var tk=loadTok();
    h+='<div class="card"><div class="card-h"><h2>Hubungkan Strava langsung</h2>'+(tk?'<span class="pill good"><i class="dot"></i>Tersambung</span>':'<span class="pill warn"><i class="dot"></i>Belum</span>')+'</div>'+
       (tokMsg?'<div class="status" role="status">'+esc(tokMsg)+'</div>':'')+
       (tk?'<p class="note">Tersambung'+(tk.name?' sebagai <b>'+esc(tk.name)+'</b>':'')+'. Aktivitas dibaca otomatis tiap aplikasi dibuka atau saat Sinkron ditekan.</p>':
          '<p class="note">Login sekali ke Strava, lalu aktivitas dibaca otomatis tanpa salin-tempel. Isi Client Secret dari strava.com/settings/api. Rahasia ini hanya disimpan di browser perangkat ini.</p><div class="fld"><label for="stSecret">Client Secret Strava</label><input id="stSecret" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tempel Client Secret"></div>')+
       '<div class="btnrow">'+(tk?'<button class="btn ghost" data-act="tok-copy">Salin sambungan</button><button class="btn ghost" data-act="tok-off">Putuskan</button>':'<button class="btn" data-act="tok-on">Hubungkan Strava</button>')+'</div>'+
       '<p class="note">Bila aplikasi layar utama di iPhone membuka login di jendela terpisah dan sambungan tidak tersimpan, hubungkan lewat Safari, tekan Salin sambungan, lalu tempel di kotak "Tempel data" di bawah pada aplikasi layar utama.</p></div>';
  }
  h+='<div class="card"><h3>Pindahkan data Strava ke aplikasi di layar utama</h3>'+
     '<p class="note">Aplikasi yang dipasang di layar utama tidak bisa membaca Strava langsung. Caranya: buka halaman ini di aplikasi Claude, tekan Sinkron, lalu tekan Salin data. Buka aplikasi di layar utama, tempel di kotak di bawah, lalu tekan Muat data. Ulangi kapan saja ingin memperbarui.</p>'+
     (S.sync.code==="snap" ? '<div class="status">Memakai salinan data tanggal '+new Date(S.sync.at).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+' ('+S.acts.length+' aktivitas).</div>' : '')+
     (snapMsg?'<div class="status" role="status">'+esc(snapMsg)+'</div>':'')+
     '<div class="btnrow"><button class="btn ghost" data-act="snapcopy" '+(S.acts.length && !fromSnap?'':'disabled')+'>Salin data</button>'+(fromSnap?'<button class="btn ghost" data-act="snapclear">Hapus salinan</button>':'')+'</div>'+
     '<div class="fld"><label for="snapIn">Tempel data di sini</label><textarea id="snapIn" rows="3" placeholder="Tempel hasil Salin data" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px"></textarea></div>'+
     '<div class="btnrow"><button class="btn" data-act="snapload">Muat data</button></div></div>';

  h+='<div class="card"><div class="card-h"><h2>Garmin</h2>'+(S.set.garmin?'<span class="pill good"><i class="dot"></i>Lewat Strava</span>':'<span class="pill warn"><i class="dot"></i>Belum dikonfirmasi</span>')+'</div>'+
     '<p>Tidak ada konektor Garmin langsung. Data jam Garmin masuk ke dasbor lewat Strava: jam sinkron ke Garmin Connect, Garmin Connect mengirim ke Strava, lalu halaman ini membaca Strava.</p>'+

     '<div class="status">'+(ok ? (last ? 'Aktivitas terbaru di Strava: <b>'+esc(last)+'</b>. Bila lari terakhir dari jam belum muncul, cek langkah di atas.' : 'Belum ada aktivitas terbaca sejak 4 minggu sebelum program mulai.') : 'Sinkron Strava dulu untuk melihat aktivitas terbaru dari jam.')+'</div>'+

     '<div class="btnrow"><button class="btn ghost sm" data-act="race-reset">Pakai 24 Okt 2027</button><button class="btn ghost sm" data-act="clear-manual">Hapus tanda manual dan tukar hari</button></div></div>';

  h+='<div class="card"><h3>Penyimpanan</h3><p class="note">Pengaturan dan tanda manual disimpan di browser ini saja dan tidak ikut ke perangkat lain. Data Strava tidak disimpan di halaman, selalu dibaca ulang dari Strava.</p>'+
     '<div class="btnrow"><button class="btn ghost sm" data-act="set-reset">Atur ulang semua pengaturan</button></div></div>';

function renderAll(){
  renderTabs(); renderDash(); renderPlan();
  var a=document.activeElement && document.activeElement.id;
  if(a!=="hmIn" && a!=="tgIn") renderPace();
  renderGuide();
  if(a!=="raceIn") renderSet();
}

/* ---------- interaksi ---------- */
document.addEventListener("click", function(e){
  var el=e.target.closest ? e.target.closest("[data-act]") : null; if(!el) return;
  var act=el.getAttribute("data-act"), v=el.getAttribute("data-v");
  if(act==="tab"){ S.tab=v; renderTabs(); window.scrollTo(0,0); return; }
  if(act==="pickweek"||act==="pickweek2"){ S.sel=+v; S.swapFrom=null; renderDash(); renderPlan(); return; }
  if(act==="openweek"){ S.sel=+v; S.tab="plan"; renderAll(); window.scrollTo(0,0); return; }
  if(act==="wk"){ S.sel=Math.max(1,Math.min(N,S.sel+(+v))); S.swapFrom=null; renderDash(); renderPlan(); return; }
  if(act==="swap"){
    var dd=+v;
    if(!S.swapFrom || S.swapFrom.w!==S.sel){ S.swapFrom={w:S.sel,d:dd}; }
    else if(S.swapFrom.d===dd){ S.swapFrom=null; }
    else { swapDays(S.sel,S.swapFrom.d,dd); S.swapFrom=null; }
    renderDash(); renderPlan(); return;
  }
  if(act==="swapcancel"){ S.swapFrom=null; renderPlan(); return; }
  if(act==="perm-reset"){ delete S.perm[S.sel]; savePerm(); S.swapFrom=null; renderDash(); renderPlan(); return; }
  if(act==="gocur"){ S.sel=curWeek(); renderDash(); renderPlan(); return; }
  if(act==="toggle"){ if(S.manual[v]) delete S.manual[v]; else S.manual[v]=1; store("sub4.manual", JSON.stringify(S.manual)); renderDash(); renderPlan(); return; }
  if(act==="tok-on"){ connectStrava(); return; }
  if(act==="tok-off"){ try{ localStorage.removeItem("sub4.tok"); localStorage.removeItem("sub4.cs"); }catch(e){} S.acts=[]; indexActs(); S.profile=null; S.sync={state:"idle", msg:"", at:null, code:""}; tokMsg="Sambungan diputus di perangkat ini. Untuk mencabut akses sepenuhnya, buka strava.com/settings/apps."; renderAll(); return; }
  if(act==="tok-copy"){
    var tt=JSON.stringify({v:2, tok:loadTok()});
    var dn=function(ok){ tokMsg= ok ? "Sambungan tersalin. Tempel di aplikasi layar utama." : "Gagal menyalin otomatis."; renderSet(); };
    try{ navigator.clipboard.writeText(tt).then(function(){ dn(true); }, function(){ dn(false); }); }catch(e){ dn(false); }
    return;
  }
  if(act==="snapcopy"){
    var txt=snapCopyText();
    var done=function(ok){ snapMsg= ok ? "Data tersalin ("+S.acts.length+" aktivitas). Tempel di aplikasi layar utama." : "Gagal menyalin otomatis. Tekan lama kotak di bawah, pilih Salin."; if(!ok){ var ta=document.getElementById("snapIn"); if(ta){ ta.value=txt; ta.focus(); ta.select(); } } renderSet(); if(!ok){ var t2=document.getElementById("snapIn"); if(t2){ t2.value=txt; t2.focus(); t2.select(); } } };
    try{ navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ done(false); }); }catch(e){ done(false); }
    return;
  }
  if(act==="snapload"){
    var ta=document.getElementById("snapIn"), val=ta?ta.value:"";
    var pj=null; try{ pj=JSON.parse(String(val).trim()); }catch(e){}
    if(pj && pj.v===2 && pj.tok && pj.tok.rt){ saveTok(pj.tok); tokMsg="Sambungan Strava dimuat."; snapMsg="Sambungan dimuat."; renderAll(); sync(true); return; }
    try{ var o=snapParse(val); store("sub4.snap", JSON.stringify(o)); S.acts=o.acts; indexActs(); S.sync={state:"ok", msg:"", at:o.at, code:"snap"}; snapMsg="Data dimuat: "+o.acts.length+" aktivitas."; }
    catch(e){ snapMsg="Data tidak dikenali. Pastikan menempel hasil Salin data dari aplikasi Claude."; }
    renderAll(); return;
  }
  if(act==="snapclear"){ try{ localStorage.removeItem("sub4.snap"); }catch(e){} S.acts=[]; indexActs(); S.sync={state:"idle", msg:"", at:null, code:""}; snapMsg="Salinan dihapus."; renderAll(); return; }
  if(act==="sync"){ sync(true); return; }
  if(act==="test"){ testConn(); return; }
  if(act==="perms"){ managePerms(); return; }
  if(act==="race-reset"){ applyRace("2027-10-24"); return; }
  if(act==="clear-manual"){ S.manual={}; S.perm={}; S.swapFrom=null; store("sub4.manual","{}"); savePerm(); renderAll(); return; }
  if(act==="set-reset"){ S.set=JSON.parse(JSON.stringify(DEFSET)); saveSet(); setRace(S.set.race); S.sel=curWeek(); S.testMsg=""; renderAll(); if(S.set.strava && S.set.auto) sync(false); return; }
  if(act==="strat"){ S.strat=v; renderPace(); return; }
});
document.addEventListener("input", function(e){
  var el=e.target; if(!el.getAttribute) return;
  var act=el.getAttribute("data-act");
  if(act==="hm"){ S.hm=el.value; var o=document.getElementById("hmOut"); if(o) o.innerHTML=hmOut(); }
  if(act==="target"){ S.target=el.value; var o2=document.getElementById("tgOut"); if(o2) o2.innerHTML=tgOut(); }
});
function applyRace(v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
  S.set.race=v; saveSet(); setRace(v); S.sel=curWeek(); S.acts=[]; indexActs(); S.sync.state="idle"; renderAll();
  if(S.set.strava) sync(true);
}
document.addEventListener("change", function(e){
  var el=e.target; if(!el.getAttribute) return;
  var act=el.getAttribute("data-act");
  if(act==="set"){
    var k=el.getAttribute("data-k"); S.set[k]=!!el.checked; saveSet();
    if(k==="strava"){ if(!S.set.strava){ S.acts=[]; indexActs(); S.zones=null; S.profile=null; S.sync={state:"off", msg:"Sinkron Strava dimatikan di Pengaturan.", at:null, code:"off"}; } else { S.sync={state:"idle", msg:"", at:null, code:""}; sync(false); } }
    renderAll(); return;
  }
  if(act==="race"){ applyRace(el.value); return; }
});
document.getElementById("themeBtn").addEventListener("click", function(){
  var r=document.documentElement, cur=r.getAttribute("data-theme");
  var dark = cur ? cur==="dark" : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  var next = dark ? "light" : "dark"; r.setAttribute("data-theme", next); store("sub4.theme", next);
});

      icons:[{src:ICON192,sizes:"192x192",type:"image/png",purpose:"any"},{src:ICON512,sizes:"512x512",type:"image/png",purpose:"any"},{src:ICON512,sizes:"512x512",type:"image/png",purpose:"maskable"}]};
    add("link",{rel:"manifest",href:URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}))});

renderAll();
handleCallback().then(function(){
  if(S.set.strava && (S.set.auto || loadTok() && tokMsg==="Strava tersambung.")) sync(false);
  else if(!S.set.strava) sync(false);
  else renderAll();
});
})();
